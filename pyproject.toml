[project]
name = "autodj"
version = "0.1.0"
description = "Automated DJ engine: offline audio analysis, compatibility-ranked track selection, beat-aligned equal-power transitions"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    # Audio is handled as float32 PCM arrays from the decode boundary onwards.
    "librosa>=1.0.0",
    "numpy>=2.1",
    # Pitch-preserving stretch via Rubber Band; GPLv3, see docs/licensing.md.
    "pedalboard>=0.9.25",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/autodj"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["autodj"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*", "pedalboard", "pedalboard.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "autodj"
include_external_packages = true

# The runtime path may depend on the offline path, never the reverse.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "autodj.api",
    "autodj.services",
    "autodj.render",
    "autodj.audio",
]

# audio/ and dj/ are pure: numpy and dataclasses in, values out.
[[tool.importlinter.contracts]]
name = "Pure analysis and decision layers"
type = "forbidden"
source_modules = ["autodj.audio", "autodj.dj"]
forbidden_modules = [
    "autodj.api",
    "autodj.persistence",
    "autodj.services",
    "alembic",
    "fastapi",
    "sqlalchemy",
]

# Decision logic, rendering and metrics must not reach sideways into each other;
# only services/ composes them.
[[tool.importlinter.contracts]]
name = "Decision, render and metrics layers are independent"
type = "independence"
modules = ["autodj.dj", "autodj.render", "autodj.metrics"]
