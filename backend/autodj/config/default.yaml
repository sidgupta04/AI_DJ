# AutoDJ default configuration.
#
# Every value here is a starting hypothesis with a stated reason, not a tuned constant.
# Overrides: environment variables (AUTODJ_ prefix, nested keys use __), or a .env file.
# Experiment history for these values lives in docs/parameters.md and docs/experiments.md.

# --- Runtime paths and logging -------------------------------------------------------------
database_url: postgresql+psycopg://autodj:autodj@localhost:5432/autodj
audio_library_dir: ./audio       # read-only source library, never committed or modified
render_cache_dir: ./render_cache # generated mixes and transition excerpts
log_level: INFO
log_format: console              # console for humans, json for machine-readable logs

# --- Library ingestion --------------------------------------------------------------------
ingestion:
  # Extensions considered audio. Matching is case-insensitive.
  extensions: [".mp3", ".wav", ".flac", ".m4a", ".aiff", ".aif", ".ogg", ".opus"]
  # Only this much audio is decoded to prove a file is usable. Full decodes happen during
  # analysis, so ingestion stays fast on a library of a few hundred files.
  validation_seconds: 30.0
  # A silent opening is not a defect: ambient intros and padded exports are common. When the
  # validation window turns out to be silent, scan up to this much of the file before concluding
  # there is no audible content anywhere. Generous, because it only runs on that rare fallback.
  silence_scan_seconds: 600.0
  # Anything shorter than this is not a mixable track (jingles, artefacts, partial downloads).
  min_duration_seconds: 30.0
  # ffprobe/ffmpeg are external processes; a hung one must not stall a library scan.
  subprocess_timeout_seconds: 120.0

# --- Offline analysis ---------------------------------------------------------------------
analysis:
  # Bumping version invalidates stored features and requires deliberate reprocessing.
  # 2 = M3 energy curve + stable regions. M2 (version 1) rows are reprocessed automatically.
  version: 2
  # 22.05 kHz mono: beat precision is set by the onset-envelope frame rate, not the sample
  # rate, so this halves analysis cost. Confirmed by the M2 22.05 vs 44.1 kHz experiment.
  sample_rate: 22050
  # 512 samples at 22.05 kHz = 23.2 ms frames, the standard librosa beat-tracking grid.
  hop_length: 512
  # Beats are refined against a 256-sample (11.6 ms) envelope with parabolic interpolation
  # to recover sub-frame precision for beat alignment.
  refine_hop_length: 256
  # Weak house-tempo prior. Seeds librosa's tempo estimator and breaks exact
  # octave-score ties (87 vs 174 with equal evidence prefers 87). It does not
  # override a grid whose onset lock is better, even if that grid is farther
  # from 124.
  start_bpm: 124.0
  # Inclusive candidate band: score only eligible octaves; selected grids still pass all gates.
  min_bpm: 80.0
  # Exclude faster candidates before selecting; an eligible half-time alternative can win.
  max_bpm: 180.0
  # IBI statistics need a few bars; fewer beats than this is not a usable grid.
  min_beats: 16
  # Whole-track IBI coefficient of variation above this is not a steady beat grid.
  # Looser than stable_regions.ibi_cv_max because intros and outros are included.
  max_ibi_cv: 0.12
  # Beats must be measurably stronger in the onset envelope than the midpoints between
  # them. In-memory white noise scores around 0.13; the product gate below catches
  # resampled noise that just clears this floor.
  min_onset_contrast: 0.15
  # Floor on the heuristic quality score (regularity * contrast), not a
  # probability. Separate gates can both barely pass (44.1 kHz white noise
  # decoded to 22.05 kHz: contrast 0.16, CV 0.08, product 0.05). Click tracks
  # sit above 0.6.
  min_confidence: 0.25
  # Search +/- this many fine-envelope frames around each coarse beat. 2 frames at
  # 256/22050 is +/- 23 ms, one coarse frame, well inside a beat at house tempo.
  refine_search_radius_frames: 2

# --- Energy ------------------------------------------------------------------------------
energy:
  # RMS (dBFS window → [0, 1]) and onset (per-track percentiles → [0, 1]) are mixed only
  # after both sit on the same scale: E(t) = alpha * R(t) + (1 - alpha) * O(t). Weighted
  # toward loudness because RMS is the more stable signal.
  alpha: 0.6
  # RMS in dBFS mapped linearly across this window, then clamped: perceptual, and immune to
  # a single loud frame dominating the scale.
  rms_floor_db: -60.0
  rms_ceiling_db: 0.0
  # Curves are stored at 10 Hz; transitions care about seconds-scale energy, not frames.
  curve_hz: 10.0
  # Median resists intro/outro outliers better than the mean or p90 (M3 experiment).
  aggregation: median
  # Dual use: per-track onset → [0, 1], then library-wide scaling of the aggregated scalar
  # so cross-track energy comparison is meaningful.
  normalization_low_percentile: 5.0
  normalization_high_percentile: 95.0

# --- Stable rhythmic regions --------------------------------------------------------------
stable_regions:
  # 32 beats = 8 bars in 4/4, the same length as the default crossfade.
  window_beats: 32
  # 4-beat step keeps candidate windows dense without quadratic scoring cost.
  step_beats: 4
  # Steady house sits near 0.01-0.02; 0.06 admits real tempo drift but rejects noise.
  ibi_cv_max: 0.06
  ibi_tolerance: 0.05
  in_tolerance_fraction_min: 0.90
  # Library-normalized onset floor: rejects rhythmically sparse intros that are steady but
  # have no usable pulse.
  onset_strength_floor: 0.35
  max_regions_per_track: 8
  # Region score weights; tempo consistency dominates because drift is what breaks a mix.
  weight_tempo_consistency: 0.5
  weight_onset_strength: 0.3
  weight_in_tolerance: 0.2

# --- Candidate retrieval ------------------------------------------------------------------
retrieval:
  # Tempo compatibility is enforced by tempo.min/max_stretch_ratio (the renderer's hard
  # bound). There is no separate BPM-deviation percentage; it was redundant with the
  # stretch ratio and the relaxed variant (7%) exceeded the ±5% limit.
  energy_filter_enabled: true
  max_energy_delta: 0.25
  require_stable_region: true
  allow_repeats: false

# --- Candidate ranking --------------------------------------------------------------------
ranking:
  # Chosen priors, not learned weights: tempo > energy >> analysis confidence.
  # M6 synthetic results do not justify retuning; library/listener validation remains. Sum to 1.
  weight_tempo: 0.60
  weight_energy: 0.35
  weight_quality: 0.05

# --- Transition planning ------------------------------------------------------------------
transition:
  # 8 bars at 124 BPM is about 15.5 s: long enough to beat-match, short enough to stay musical.
  crossfade_beats: 32
  # Extra beats required inside usable audio on both sides of a transition.
  margin_beats: 8
  # Mix out late in the outgoing track, in early in the incoming track.
  outgoing_search_fraction: [0.65, 0.95]
  incoming_search_fraction: [0.0, 0.35]
  # Pair-cost weights. Must sum to 1.
  weight_stability: 0.40
  weight_energy: 0.30
  weight_stretch: 0.20
  weight_position: 0.10
  # Snap alignment to the next inferred 4/4 bar-phase beat on the M2 grid
  # (beat_index % 4 == 0). Not true downbeat detection — M2 has no downbeat model.
  align_on_downbeat: true

# --- Tempo handling -----------------------------------------------------------------------
tempo:
  # +/-5% stretch is inaudible-to-benign with Rubber Band; beyond that house loses its feel.
  min_stretch_ratio: 0.95
  max_stretch_ratio: 1.05
  # pedalboard wraps Rubber Band (GPLv3, see docs/licensing.md). rubberband_cli and
  # phase_vocoder are documented swap paths; only pedalboard is implemented.
  stretch_backend: pedalboard

# --- Rendering ----------------------------------------------------------------------------
render:
  sample_rate: 44100
  channels: 2
  # Mixes are written as 16-bit PCM WAV: no second lossy encode, plays everywhere.
  output_bit_depth: 16
  # Headroom target; the renderer measures peaks and flags anything above this.
  peak_ceiling_dbfs: -1.0

# --- Session ------------------------------------------------------------------------------
session:
  default_length: 6
  selection_strategy: greedy # random | nearest_bpm | greedy | beam

# --- Evaluation ---------------------------------------------------------------------------
evaluation:
  # Seconds of audio kept either side of a transition in exported excerpts.
  excerpt_seconds: 15.0
  # 60 paired comparisons make a sign test meaningful for a ~65/35 preference split.
  pair_count: 60
  seed: 20260915                 # fixed seed for repeatable selection and blinded ordering
  onset_hop_ms: 5.0             # RMS-rise onset envelope resolution; no beat-grid arithmetic
  alignment_max_lag_ms: 200.0   # bounded lag search, also capped below half a session beat
  alignment_min_correlation: 0.1 # report weak overlap evidence as unavailable, not zero error
  energy_window_seconds: 1.0   # compare local RMS at the beginning and end of the fade
  silence_floor_dbfs: -90.0    # finite energy floor and silence rejection for alignment
  minimum_listeners: 3         # owner follow-up; independent votes are aggregated by track pair
