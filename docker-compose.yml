services:
  postgres:
    image: postgres:16
    container_name: autodj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autodj
      POSTGRES_PASSWORD: autodj
      POSTGRES_DB: autodj
    ports:
      - "5432:5432"
    volumes:
      - autodj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodj -d autodj"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autodj-pgdata:
