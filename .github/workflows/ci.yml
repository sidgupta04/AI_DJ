name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autodj
          POSTGRES_PASSWORD: autodj
          POSTGRES_DB: autodj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autodj -d autodj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTODJ_DATABASE_URL: postgresql+psycopg://autodj:autodj@localhost:5432/autodj

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Layering contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
